[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-fleet"
version = "0.1.0"
description = "Supervise N isolated Apollo (Sunshine) instances on one Windows host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
apollo-fleet = "apollo_fleet.supervisor:main"
apollo-fleet-tray = "apollo_fleet.tray:main"

[tool.setuptools.packages.find]
where = ["src"]
