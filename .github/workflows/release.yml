name: build-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches tag
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          $tag = $env:GIT_REF -replace '^v', ''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag $env:GIT_REF (-> $tag) does not match Cargo.toml version $cargo"
            exit 1
          }

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename binary
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/apollo-fleet.exe ApolloFleet.exe

      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: ApolloFleet.exe
          generate_release_notes: true
