[package]
name = "apollo-fleet"
version = "0.1.0"
edition = "2021"
description = "Supervise N isolated Apollo (Sunshine) instances on one Windows host"
license = "MIT"
publish = false

[[bin]]
name = "apollo-fleet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
notify = "7"
once_cell = "1"
parking_lot = "0.12"
resvg = { version = "0.45", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tray-icon = "0.19"
webbrowser = "1"
winit = "0.30"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
]

[build-dependencies]
embed-manifest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.winres]
ProductName = "Apollo Fleet"
FileDescription = "Apollo Fleet tray supervisor"
